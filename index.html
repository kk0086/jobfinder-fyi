<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Finder</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e6e5df;--accent:#2f6fed;--accent-soft:#e8f0fe;--ok:#1a7f4b;--warn:#b26a00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1c1c1a;--ink:#ecebe6;--muted:#9a9990;--line:#2f2f2b;--accent:#6c9cff;--accent-soft:#1d2a44;--ok:#4cc38a;--warn:#e0a040;--bad:#f27b73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1c1c1a;--ink:#ecebe6;--muted:#9a9990;--line:#2f2f2b;--accent:#6c9cff;--accent-soft:#1d2a44;--ok:#4cc38a;--warn:#e0a040;--bad:#f27b73;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:4px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.tile{padding:6px 12px}.tile b{display:inline;font-size:18px;letter-spacing:-.3px;margin-right:6px}.tile span{color:var(--muted);font-size:12px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:10px}
.card{padding:8px 12px}.card h2{font-size:11px;margin:0 0 4px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.bar{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:8px;font-size:12px;margin:1px 0;cursor:pointer;border-radius:4px}
.bar:hover{background:var(--accent-soft)}
.bar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:7px;background:var(--line);border-radius:5px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar.on{background:var(--accent-soft);outline:1px solid var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input,.filters select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
.filters input{flex:1 1 220px}
.meta{color:var(--muted);font-size:13px;margin:6px 2px}
.list{display:flex;flex-direction:column;gap:6px}
.job{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit}
.job:hover{border-color:var(--accent)}
.job .t{font-weight:600}.job .c{color:var(--muted);font-size:13px}
.job .r{grid-row:1/3;grid-column:2;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.cov{width:100%;border-collapse:collapse;font-size:13px}.cov td,.cov th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}
.s-ok{color:var(--ok)}.s-partial{color:var(--warn)}.s-failed,.s-unsupported{color:var(--bad)}.s-queued{color:var(--muted,#888)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0;font-size:13px}.pager button:disabled{opacity:.4;cursor:default}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
details{margin-top:18px}summary{cursor:pointer;color:var(--muted);font-size:13px}
@media (max-width:520px){.bar{grid-template-columns:80px 1fr 34px}.job{grid-template-columns:1fr}.job .r{grid-row:auto;grid-column:1;text-align:left}}

#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg,#fff);transition:opacity .35s ease}
#splash.off{opacity:0;pointer-events:none}
#splash .logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.5px}
#splash .ring{position:relative;width:84px;height:84px}
#splash .ring svg{transform:rotate(-90deg)}
#splash .ring circle{fill:none;stroke-width:6}
#splash .ring .bg{stroke:var(--line,#e5e7eb)}
#splash .ring .fg{stroke:var(--accent,#2563eb);stroke-linecap:round;stroke-dasharray:238.76;stroke-dashoffset:238.76;animation:jfring 3s linear forwards}
#splash .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
#splash .msg{color:var(--muted,#6b7280);font-size:14px;min-height:1.2em}
@keyframes jfring{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#splash .ring .fg{animation:none;stroke-dashoffset:60}}
.fs{font-style:normal;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(127,127,127,.18);color:inherit;opacity:.75}
.ms{position:relative}
.ms>button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;min-width:170px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ms>button.on{border-color:var(--accent);background:var(--accent-soft)}
.ms .pn{display:none;position:absolute;z-index:30;top:calc(100% + 4px);left:0;width:300px;max-width:88vw;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px}
.ms.open .pn{display:block}
.ms .pn input[type=search]{width:100%;box-sizing:border-box;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ms .ls{max-height:300px;overflow:auto;margin:6px 0}
.ms .ls label{display:grid;grid-template-columns:1fr auto 20px;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1.25}
.ms .ls label>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.ms .ls input[type=checkbox]{flex:none;width:16px;height:16px;min-width:0;padding:0;margin:0;justify-self:end;accent-color:var(--accent)}
.ms .ls label:hover{background:var(--accent-soft)}
.ms .ls span.n{color:var(--muted);font-size:12px;text-align:right;min-width:28px}
.ms .ft{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ms .ft a{color:var(--accent);cursor:pointer}
</style>
<script>window.__jp=fetch("/api/jobs").then(function(r){return r.ok?r.json():null}).catch(function(){return null});</script>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent,#2563eb)"/><circle cx="15" cy="15" r="6.5" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M20 20l6 6" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>Job Finder</div>
  <div class="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="38"/><circle class="fg" cx="42" cy="42" r="38"/></svg><div class="num" id="splashn">3</div></div>
  <div class="msg" id="splashm">Finding open roles for you…</div>
</div>
<script>(function(){var n=3,el=document.getElementById("splashn"),m=document.getElementById("splashm"),t0=Date.now();
window.__splash=setInterval(function(){var s=Math.ceil(3-(Date.now()-t0)/1000);if(s>=1)el.textContent=s;else{el.textContent="…";m.textContent="Almost there — loading all roles…"}},200);
window.hideSplash=function(){clearInterval(window.__splash);var e=document.getElementById("splash");if(e){e.classList.add("off");setTimeout(function(){e.remove()},400)}};
setTimeout(function(){if(document.getElementById("splash"))window.hideSplash()},20000)})();</script>

<div class="wrap">
  <h1>Job Finder</h1>
  <div class="filters">
    <select id="fdomain"><option value="">All domains</option></select>
    <select id="frole"><option value="">All roles</option><option value="Product management">Product management</option><option value="Software engineering">Software engineering</option><option value="Data engineering">Data engineering, ML &amp; BI</option><option value="Technical program management">Technical program management</option><option value="Program management">Program management</option><option value="UX design">UX design</option><option value="Human resources">Human resources</option><option value="Legal">Legal</option><option value="Financial analyst">Financial analyst</option><option value="Marketing">Marketing</option><option value="Operations">Operations</option></select>
    <input id="q" type="search" placeholder="Search title, company, location">
    <div class="ms" id="fcw"><button type="button" id="fcb"><span id="fcl">All companies</span><span>▾</span></button><input type="hidden" id="fc"><div class="pn"><input type="search" id="fcs" placeholder="Search companies"><div class="ls" id="fcls"></div><div class="ft"><a id="fcclr">Clear</a><a id="fcdone">Done</a></div></div></div>
    <select id="fs"><option value="">All states</option></select>
    <select id="fd"><option value="">All departments</option></select>
    <select id="fl"><option value="">All seniority</option></select>
    <select id="fr"><option value="">Remote + onsite</option><option value="1">Remote only</option><option value="0">Onsite only</option></select>
    <label class="chk"><input id="ffit" type="checkbox"> Director, Principal, Staff and up</label>
    <button id="reset">Reset</button>
  </div>
  <div class="sub" id="asof"></div>
  <div class="tiles" id="tiles"></div>
  <div class="charts" id="charts"></div>
  <div class="meta" id="count"></div>
  <div class="pager" id="pgTop"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pgBot"></div>
</div>
<script>
let DATA = {"live": true, "generated_at": "2026-10-21T00:30:00-07:00", "companies": [], "companyCount": 500};
const $ = id => document.getElementById(id);
const NOW = Date.now(), DAY = 864e5;
let jobs = [];
const prep = j => {
  // Prefer a true posting date; fall back to last-updated, flagged so the UI can say so.
  const p = j.posted ? Date.parse(j.posted) : null, u = j.updated ? Date.parse(j.updated) : null;
  return {...j, ts: p ?? u, tsKind: p ? "Posted" : (u ? "Updated" : "")};
};
const FIT = ["Director", "Executive", "Principal+"];
const DEFAULTS = {company:[], state:"", dept:"", level:"", remote:"", q:"", role:"", domain:"", fit:false};
const F = {...DEFAULTS, company: []};
let page = 0; const PER = 50;

const ago = ts => {
  if (!ts) return "date n/a";
  const m = Math.max(0, (NOW - ts) / 6e4);
  if (m < 60) return Math.round(m) + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  const d = m / 1440; return d < 60 ? Math.floor(d) + "d ago" : Math.floor(d / 30) + "mo ago";
};
const money = n => "$" + Math.round(n / 1000) + "K";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const count = (arr, fn) => { const m = new Map(); arr.forEach(x => [].concat(fn(x)).forEach(k => k && m.set(k, (m.get(k) || 0) + 1))); return [...m].sort((a, b) => b[1] - a[1]); };

function filtered(skip) {
  const q = F.q.toLowerCase();
  return jobs.filter(j =>
    (!F.role || j.role === F.role) &&
    (skip === "domain" || !F.domain || j.domains.includes(F.domain)) &&
    (!F.fit || FIT.includes(j.seniority)) &&
    (!F.company.length || F.company.includes(j.company)) &&
    (!F.state || j.states.includes(F.state)) &&
    (!F.dept || j.department === F.dept) &&
    (!F.level || j.seniority === F.level) &&
    (F.remote === "" || (F.remote === "1") === j.remote) &&
    (!q || (j.title + " " + j.company + " " + j.location).toLowerCase().includes(q))
  ).sort((a, b) => (FIT.includes(b.seniority) - FIT.includes(a.seniority)) || ((b.ts || 0) - (a.ts || 0)));
}

function fillSelect(id, entries) {
  const el = $(id), first = el.firstElementChild.outerHTML;
  el.innerHTML = first + entries.map(([k, n]) => `<option value="${esc(k)}">${esc(k)} (${n})</option>`).join("");
}

let MS = [];
function msInit(entries) {
  MS = entries;
  const w = $("fcw"), draw = () => {
    const t = $("fcs").value.trim().toLowerCase();
    $("fcls").innerHTML = MS.filter(([k]) => !t || k.toLowerCase().includes(t)).slice(0, 400).map(([k, n]) => `<label title="${esc(k)}"><span>${esc(k)}</span><span class="n">${n}</span><input type="checkbox" value="${esc(k)}" ${F.company.includes(k) ? "checked" : ""}></label>`).join("") || '<div class="meta">No match</div>';
  };
  w.draw = draw; draw();
  $("fcb").onclick = () => { w.classList.toggle("open"); if (w.classList.contains("open")) { const pn = w.querySelector(".pn"); pn.style.left = "0"; pn.style.right = "auto"; const r = w.getBoundingClientRect(); if (r.left + pn.offsetWidth > innerWidth - 8) { pn.style.left = "auto"; pn.style.right = "0"; if (r.right - pn.offsetWidth < 8) { pn.style.right = "auto"; pn.style.left = (8 - r.left) + "px"; } } draw(); $("fcs").focus(); } };
  $("fcs").oninput = draw;
  $("fcls").addEventListener("change", e => {
    const v = e.target.value; F.company = e.target.checked ? [...F.company, v] : F.company.filter(x => x !== v);
    page = 0; const h = $("fc"); h.value = F.company.join(", "); h.dispatchEvent(new Event("change", { bubbles: true })); msSync(true); render();
  });
  $("fcclr").onclick = () => { F.company = []; page = 0; msSync(); render(); };
  $("fcdone").onclick = () => w.classList.remove("open");
  document.addEventListener("click", e => { if (!w.contains(e.target)) w.classList.remove("open"); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") w.classList.remove("open"); });
}
function msSync(keep) {
  const n = F.company.length;
  $("fcl").textContent = n === 0 ? "All companies" : n === 1 ? F.company[0] : n + " companies";
  $("fcb").classList.toggle("on", n > 0);
  if (!keep && $("fcw").draw) $("fcw").draw();
}

function bars(title, entries, key, max = 5) {
  const top = entries.slice(0, max), peak = top[0] ? top[0][1] : 1;
  return `<div class="card"><h2>${title}</h2>${top.map(([k, n]) =>
    `<div class="bar ${(key === "company" ? F.company.includes(k) : F[key] === k) ? "on" : ""}" data-k="${key}" data-v="${esc(k)}" title="Filter by ${esc(k)}"><span class="l">${esc(k)}</span><span class="t"><i style="width:${n / peak * 100}%"></i></span><span class="n">${n}</span></div>`).join("")}</div>`;
}

function render() {
  const rows = filtered();
  // Domain options and the domain chart count roles under every other active filter, so they work as a navigator.
  const base = filtered("domain"), dcount = count(base, j => j.domains);
  $("fdomain").innerHTML = '<option value="">All domains (' + base.length + ')</option>' + dcount.map(([k, n]) => `<option value="${esc(k)}">${esc(k)} (${n})</option>`).join("");
  $("fdomain").value = F.domain;
  const week = rows.filter(j => j.ts && NOW - j.ts <= 7 * DAY).length;
  $("tiles").innerHTML = [
    [rows.length.toLocaleString(), "open US roles (matching)"],
    [new Set(rows.map(j => j.company)).size, "companies"],
    [rows.length ? Math.round(rows.filter(j => j.remote).length / rows.length * 100) + "%" : "0%", "remote"],
    [week, "dated in last 7 days"],
  ].map(([b, s]) => `<div class="tile"><b>${b}</b><span>${s}</span></div>`).join("");

  // Age buckets in days: [label, min age (exclusive, except first), max age (inclusive)]
  const recency = [["Last 24h", -1, 1], ["2-7 days", 1, 7], ["8-30 days", 7, 30], ["Older", 30, 1e9]].map(([l, lo, hi]) =>
    [l, rows.filter(j => { const age = (NOW - j.ts) / DAY; return j.ts && age > lo && age <= hi; }).length]);
  const undated = rows.filter(j => !j.ts).length;
  if (undated) recency.push(["No date", undated]);
  $("charts").innerHTML =
    bars("By state", count(rows, j => j.states), "state") +
    bars("By seniority", count(rows, j => j.seniority), "level") +
    bars("By company", count(rows, j => j.company), "company") +
    `<div class="card"><h2>By recency</h2>${recency.map(([l, n]) => `<div class="bar" style="cursor:default"><span class="l">${l}</span><span class="t"><i style="width:${n / Math.max(1, ...recency.map(r => r[1])) * 100}%"></i></span><span class="n">${n}</span></div>`).join("")}</div>`;

  const pages = Math.max(1, Math.ceil(rows.length / PER));
  if (page >= pages) page = pages - 1;
  const lo = page * PER;
  $("count").textContent = `${rows.length.toLocaleString()} roles` + (rows.length > PER ? `, showing ${lo + 1}–${Math.min(rows.length, lo + PER)}` : "");
  const pg = rows.length > PER ? `<button data-pg="-1" ${page === 0 ? "disabled" : ""}>← Previous</button><span>Page ${page + 1} of ${pages}</span><button data-pg="1" ${page >= pages - 1 ? "disabled" : ""}>Next →</button>` : "";
  $("pgTop").innerHTML = pg; $("pgBot").innerHTML = pg;
  $("list").innerHTML = rows.slice(lo, lo + PER).map(j => `
    <a class="job" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">
      <span class="t">${esc(j.title)}${j.remote ? '<span class="tag">Remote</span>' : ""}${j.example ? '<span class="tag">Your example</span>' : ""}${FIT.includes(j.seniority) ? '<span class="tag">' + esc(j.seniority === "Principal+" ? "Staff / Principal / Group" : j.seniority) + '</span>' : ""}</span>
      <span class="r">${j.tsKind ? j.tsKind + " " : ""}${ago(j.ts)}</span>
      <span class="c">${esc(j.company)} · ${esc(j.location || "Location n/a")} · ${esc(j.department)}${j.salary_min ? " · " + money(j.salary_min) + (j.salary_max ? "–" + money(j.salary_max) : "") : ""}${j.src === "search" ? " · <i class=\"fs\">from search</i>" : ""}</span>
    </a>`).join("") || '<div class="meta">No roles match these filters.</div>';
}

function init() {
  const when = new Date(DATA.generated_at);
  $("asof").textContent = `Data as of ${isNaN(when) ? "unknown" : when.toLocaleString()} · ${DATA.companyCount ?? DATA.companies.length} companies`;
  msInit(count(jobs, j => j.company));
  fillSelect("fs", count(jobs, j => j.states));
  fillSelect("fd", count(jobs, j => j.department));
  fillSelect("fl", count(jobs, j => j.seniority));
  const bind = (id, key, ev = "change") => $(id).addEventListener(ev, e => { F[key] = e.target.value; page = 0; sync(); render(); });
  bind("frole", "role"); bind("fdomain", "domain"); $("ffit").addEventListener("change", e => { F.fit = e.target.checked; page = 0; render(); });
  bind("fs", "state"); bind("fd", "dept"); bind("fl", "level"); bind("fr", "remote"); bind("q", "q", "input");
  $("reset").onclick = () => { Object.assign(F, DEFAULTS, { company: [] }); $("q").value = ""; page = 0; sync(); render(); };
  const pgClick = e => { const b = e.target.closest("button[data-pg]"); if (!b || b.disabled) return; page += +b.dataset.pg; render(); (e.currentTarget.id === "pgBot" ? $("count") : $("pgTop")).scrollIntoView({ block: "start" }); };
  $("pgTop").onclick = pgClick; $("pgBot").onclick = pgClick;
  $("charts").addEventListener("click", e => {
    const b = e.target.closest(".bar[data-k]"); if (!b) return;
    const k = b.dataset.k, v = b.dataset.v; if (k === "company") F.company = F.company.includes(v) ? F.company.filter(x => x !== v) : [...F.company, v]; else F[k] = F[k] === v ? "" : v; page = 0; sync(); render();
  });
  render();
}
function sync() { $("frole").value = F.role; $("fdomain").value = F.domain; $("ffit").checked = F.fit; msSync(); $("fs").value = F.state; $("fd").value = F.dept; $("fl").value = F.level; $("fr").value = F.remote; }
async function boot() {
  if (DATA.live) {
    $("list").innerHTML = '<div class="meta">Loading jobs…</div>';
    try { const j = window.__jp ? await window.__jp : null; if (j) DATA = j; else { const r = await fetch("/api/jobs"); if (!r.ok) throw 0; DATA = await r.json(); } }
    catch (e) { $("list").innerHTML = '<div class="meta">Could not load jobs. Please refresh the page.</div>'; if (window.hideSplash) window.hideSplash(); return; }
  }
  jobs = DATA.jobs.map(prep);
  init();
  if (window.hideSplash) window.hideSplash();
}
boot();
</script>
<script>
/* Anonymous first-party visit stats (no cookies, no IP stored). Owner devices that opened /admin are skipped. */
(function(){try{
  if(localStorage.getItem("jf_owner")||navigator.doNotTrack==="1"||!/^https?:/.test(location.protocol)||location.hostname==="localhost")return;
  var id=function(){return(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now().toString(36))};
  var vid=localStorage.getItem("jf_vid"),returning=!!vid;if(!vid){vid=id();localStorage.setItem("jf_vid",vid)}
  var S=null;try{S=JSON.parse(sessionStorage.getItem("jf_s")||"null")}catch(e){}
  if(!S||Date.now()-S.last>30*60*1000){S={sid:id(),start:Date.now(),active:0,views:0,clicks:[],ref:document.referrer||"",last:Date.now()};
    try{var qs=new URLSearchParams(location.search);S.utm=[qs.get("utm_source"),qs.get("utm_medium"),qs.get("utm_campaign")].filter(Boolean).join(" / ").slice(0,80);
      S.lang=(navigator.language||"").slice(0,12);S.scr=screen.width+"x"+screen.height;S.tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||"").slice(0,40);S.land=location.pathname.slice(0,60)}catch(e){}

  S.views++;S.vid=vid;S.returning=returning;
  var tick=Date.now();

    try{sessionStorage.setItem("jf_s",JSON.stringify(S))}catch(e){}
    var b=JSON.stringify({sid:S.sid,vid:S.vid,start:S.start,active:Math.round(S.active),views:S.views,clicks:S.clicks,ref:S.ref,returning:S.returning,utm:S.utm,lang:S.lang,scr:S.scr,tz:S.tz,land:S.land,f:S.f,q:S.q,pg:S.pg});
    if(navigator.sendBeacon)navigator.sendBeacon("/api/collect",new Blob([b],{type:"text/plain"}));else fetch("/api/collect",{method:"POST",body:b,keepalive:true})}
  send();setInterval(function(){if(document.visibilityState==="visible")send();else tick=Date.now()},15000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")send();else tick=Date.now()});

    if(/^(fdomain|frole|fc|fs|fd|fl|fr|ffit)$/.test(t.id)){var v=t.type==="checkbox"?(t.checked?"on":"off"):t.value;if(v&&S.f.length<40){S.f.push(t.id+":"+String(v).slice(0,60));send()}}
    else if(t.id==="q"){var q=(t.value||"").trim().toLowerCase().slice(0,40);if(q&&S.q.length<12){S.q.push(q);send()}}},true);
  document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("[data-pg]")){S.pg++;send()}},true);
  document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a.job");if(!a||S.clicks.length>=25)return;
    var t=a.querySelector(".t"),c=a.querySelector(".c");S.clicks.push({co:c?c.textContent.split(" · ")[0]:"",t:t?(t.firstChild?t.firstChild.textContent:""):""});send()},true);
}catch(e){}})();
