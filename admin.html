<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Job Finder · Traffic</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--muted:#667085;--line:#e4e7ec;--acc:#2f5fd0;--bar:#9db6ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaee;--muted:#98a1b3;--line:#262b36;--acc:#7aa2ff;--bar:#2a3b66}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 60px}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.tile span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line)}.row:first-of-type{border:0}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.row span:last-child{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px}.chart i{flex:1;background:var(--bar);border-radius:2px 2px 0 0;min-height:2px;position:relative}.chart i:hover{background:var(--acc)}
select,input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}button{cursor:pointer}
#login{max-width:340px;margin:12vh auto}#login form{display:flex;gap:8px}#login input{flex:1}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;text-align:left;border-top:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}
.s-ok{color:#12b76a}.s-partial{color:#dc6803}.s-failed,.s-unsupported{color:#d92d20}
.err{color:#d92d20;margin-top:8px}.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#12b76a;margin-right:6px}
.brand{display:inline-block;margin:0 0 14px}.brand img{display:block;height:56px;width:56px}
</style></head><body><div class="w">
<a class="brand" href="/" aria-label="Job Finder home"><img src="/logo.png?v=2" alt="Job Finder" width="56" height="56"></a>
<div id="login" class="card"><h1>Traffic</h1><div class="sub">Owner access only.</div>
<form id="f"><input id="k" type="password" placeholder="Admin key" autocomplete="current-password" required><button>View</button></form><div class="err" id="e"></div></div>
<div id="app" hidden>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h1>Job Finder traffic</h1><div class="sub" id="sub"></div></div>
<div><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select> <button id="rf">Refresh</button> <button id="out">Sign out</button></div></div>
<div class="tiles" id="tiles"></div>
<div class="card"><h2>Visitors per day</h2><div class="chart" id="chart"></div><div class="sub" id="axis" style="display:flex;justify-content:space-between;margin:4px 0 0"></div></div>
<div class="grid" id="grid"></div>
<div class="card" id="refcard" style="margin-top:12px"><h2>Live job refresh</h2><div id="refsum" class="sub"></div><button id="refnow">Refresh all companies now</button> <span id="refmsg" class="sub"></span></div>
<div class="card" id="covcard" style="margin-top:12px"><h2>Job data coverage</h2><div id="covsum" class="sub"></div><details><summary style="cursor:pointer">Coverage by company</summary><div style="overflow:auto;margin-top:8px"><table id="cov"></table></div></details></div>
<div class="card" id="usercard" style="margin-top:12px"><h2>Member profiles</h2><div class="sub" id="usum">Loading…</div><button id="exUsers">Download all profiles (CSV)</button> <button id="exUsersJson">Download JSON</button> <span id="uMsg" class="sub"></span><div style="overflow:auto;margin-top:10px"><table id="utable"></table></div></div>
<div class="card" style="margin-top:12px"><h2>Export visits</h2><div class="sub">Every stored visit, one row per visit (CSV opens in Excel or Google Sheets).</div><button id="exCsv">Download all visits (CSV)</button> <button id="exJson">Download JSON</button> <span id="exMsg" class="sub"></span></div>
<div class="card" style="margin-top:12px"><h2>Recent visits</h2><div style="overflow:auto"><table id="recent"></table></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id);let KEY="";try{KEY=localStorage.getItem("jfk")||sessionStorage.getItem("jfk")||""}catch{}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=s=>s>=3600?(s/3600).toFixed(1)+"h":s>=60?Math.floor(s/60)+"m "+(s%60)+"s":s+"s";
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?"just now":m<60?Math.round(m)+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
async function load(){
  const r=await fetch("/api/stats?days="+$("days").value,{headers:{"x-admin-key":KEY},cache:"no-store"});
  if(r.status===401){try{sessionStorage.removeItem("jfk");localStorage.removeItem("jfk")}catch{};$("app").hidden=true;$("login").hidden=false;$("e").textContent=KEY?"Wrong key.":"";KEY="";return}
  if(!r.ok){$("e").textContent="Error "+r.status;return}
  loadUsers();const d=await r.json();try{localStorage.setItem("jfk",KEY);localStorage.setItem("jf_owner","1")}catch{}
  $("login").hidden=true;$("app").hidden=false;const t=d.totals;
  $("sub").innerHTML=`<span class="live"></span>${t.liveNow} active now · updated ${new Date(d.generated).toLocaleTimeString()}`+(d.truncated?" · capped at 20,000 sessions":"");
  const tile=(v,l)=>`<div class="card tile"><b>${v}</b><span>${l}</span></div>`;
  $("tiles").innerHTML=tile(t.visitors.toLocaleString(),"Unique visitors")+tile(t.sessions.toLocaleString(),"Visits")+tile(t.pageviews.toLocaleString(),"Page views")+tile(dur(t.avgActiveSec),"Avg time on site")+tile(dur(t.medianActiveSec),"Median time on site")+tile(t.totalActiveHours+"h","Total time spent")+tile(t.returningVisitors.toLocaleString(),"Returning visitors")+tile(t.engagedPct+"%","Engaged (10s+)")+tile(t.bouncePct+"%","Bounce")+tile(t.jobClicks.toLocaleString(),"Job link clicks");
  const mx=Math.max(1,...d.daily.map(x=>x.visitors));
  $("chart").innerHTML=d.daily.map(x=>`<i style="height:${x.visitors/mx*100}%" title="${x.d}: ${x.visitors} visitors, ${x.sessions} visits"></i>`).join("");
  $("axis").innerHTML=`<span>${d.daily[0].d}</span><span>${d.daily[d.daily.length-1].d}</span>`;
  const list=(h,a)=>`<div class="card"><h2>${h}</h2>${a.length?a.map(([k,n])=>`<div class="row"><span title="${esc(k)}">${esc(k)}</span><span>${n}</span></div>`).join(""):'<div class="sub">No data yet</div>'}</div>`;
  const FL={fdomain:"Domain",frole:"Role",fc:"Company",fs:"State",fcn:"Country",chip:"Quick pick",fl:"Seniority",fr:"Remote",ffit:"Senior only"};
  const flt=(d.filters||[]).map(([k,n])=>{const i=k.indexOf(":");return [(FL[k.slice(0,i)]||k.slice(0,i))+": "+k.slice(i+1),n]});
  const u=d.usage||{},pc=x=>t.sessions?Math.round(x/t.sessions*100)+"%":"0%";
  const hrs=d.hours||[],hm=Math.max(1,...hrs.map(x=>x[1])),wd=d.weekdays||[],wm=Math.max(1,...wd.map(x=>x[1]));
  const bars=(h,a,m)=>`<div class="card"><h2>${h}</h2><div class="chart" style="height:70px">${a.map(([k,n])=>`<i style="height:${n/m*100}%" title="${k}: ${n}"></i>`).join("")}</div><div class="sub" style="display:flex;justify-content:space-between;margin:4px 0 0"><span>${a[0][0]}</span><span>${a[a.length-1][0]}</span></div></div>`;
  $("grid").innerHTML=list("Cities",d.cities||[])+list("Countries",d.countries)+list("Regions / states",d.regions||[])+list("Devices",d.devices)+list("Browsers",d.browsers||[])+list("Operating systems",d.systems||[])+list("Languages",d.languages||[])+list("Screen sizes",d.screens||[])+list("Referrers",d.referrers)+list("Campaigns (utm)",d.campaigns||[])+list("Landing pages",d.landing||[])+bars("Visits by hour (visitor local time)",hrs,hm)+bars("Visits by weekday",wd,wm)+`<div class="card"><h2>Engagement</h2><div class="row"><span>Used a filter</span><span>${pc(u.usedFilters||0)}</span></div><div class="row"><span>Used search</span><span>${pc(u.usedSearch||0)}</span></div><div class="row"><span>Went past page 1</span><span>${pc(u.pagedDeep||0)}</span></div></div>`+list("Filters used",flt)+list("Searches typed",d.searches||[])+list("Most clicked companies",d.topCompanies)+list(`Most clicked jobs <span class="sub" style="font-weight:400">(${t.jobClicks.toLocaleString()} clicks total)</span>`,d.topJobs);
  [["Filters used","filter"],["Searches typed","search"],["Most clicked companies","click"],["Most clicked jobs","click"]].forEach(([h,k])=>{const e=[...$("grid").querySelectorAll("h2")].find(x=>x.firstChild&&x.firstChild.textContent.trim()===h||x.textContent===h);if(e&&!e.querySelector("button")){const b=document.createElement("button");b.textContent="Download CSV";b.style.cssText="float:right;font-size:12px;padding:3px 8px";b.onclick=()=>exportEvents(k,b);e.appendChild(b)}});
  $("recent").innerHTML="<tr><th>When</th><th>Where</th><th>Device</th><th>Browser</th><th>Source</th><th>Time</th><th>Views</th><th>Clicks</th><th></th></tr>"+d.recent.map(s=>`<tr><td>${ago(s.when)}</td><td>${esc([s.city,s.region,s.country].filter(Boolean).join(", ")||"—")}</td><td>${s.device}${s.os?" · "+esc(s.os):""}</td><td>${esc(s.browser||"—")}</td><td>${esc(s.ref||"Direct")}</td><td>${dur(s.active)}</td><td>${s.views}</td><td>${s.clicks}</td><td>${s.returning?"returning":"new"}</td></tr>`).join("");
  window.__nb=(d.refresh||[]).length||87;const R=d.refresh||[],done=R.filter(r=>r.at),last=done.length?new Date(Math.max(...done.map(r=>+new Date(r.at)))):null,fails=done.flatMap(r=>r.failed);
  $("refsum").innerHTML=(done.length?`${done.length} of ${R.length} batches have run; most recent ${last.toLocaleString()}. ${done.reduce((n,r)=>n+r.roles,0).toLocaleString()} roles from ${done.reduce((n,r)=>n+r.companies,0)} company job boards.`:"No refresh has run yet. It runs automatically every morning (about 6 AM Pacific).")+(fails.length?` <b>${fails.length} boards failed on the last run:</b> ${esc(fails.slice(0,8).join(", "))}${fails.length>8?"…":""}`:"");
  const cv=d.coverage,cs=cv.companies,N=x=>cs.filter(c=>c.status===x).length;
  $("covsum").innerHTML=`<b>Coverage.</b> ${cs.length} companies tracked. Complete job feeds were read for ${N("ok")}. ${N("partial")} more were read only in part (mainly senior roles). ${N("unsupported")} have no public job feed (their own or Workday careers sites), so their roles are not included. Companies marked ok are refreshed automatically every morning across all 11 role families. Many large companies with their own career sites (for example Google, Apple, Meta, Uber, Goldman Sachs, Cisco, Target and Atlassian) are also refreshed automatically across all families. ByteDance and Walmart are read by hand and have product roles only; ask me to refresh them.`+(cv.inferred_departments?` Departments are guessed from job titles for ${cv.inferred_departments} roles.`:"")+(cv.generated_at?` Job data as of ${new Date(cv.generated_at).toLocaleString()}.`:"");
  $("cov").innerHTML="<tr><th>Company</th><th>Source</th><th>Status</th><th>Note</th></tr>"+cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.ats||"")}</td><td class="s-${esc(c.status||"")}">${esc(c.status||"")}</td><td>${esc(c.note||"")}</td></tr>`).join("");
}
$("refnow").onclick=async()=>{const b=$("refnow");b.disabled=true;try{const N=window.__nb||87;for(let i=0;i<N;i++){$("refmsg").textContent=`Reading batch ${i+1} of ${N}…`;const r=await fetch("/api/refresh?chunk="+i,{method:"POST",headers:{"x-admin-key":KEY}});if(!r.ok)throw new Error("batch "+(i+1)+" failed ("+r.status+")")}$("refmsg").textContent="Done.";await load()}catch(e){$("refmsg").textContent=String(e.message||e)}b.disabled=false};
$("f").onsubmit=e=>{e.preventDefault();KEY=$("k").value;$("e").textContent="";load()};
$("days").onchange=load;$("rf").onclick=load;$("out").onclick=()=>{try{sessionStorage.removeItem("jfk");localStorage.removeItem("jfk")}catch{};location.reload()};
if(KEY)load();

let USERS=[];
async function loadUsers(){try{const r=await fetch("/api/auth/users",{headers:{"x-admin-key":KEY},cache:"no-store"});if(!r.ok)throw new Error("Could not load profiles ("+r.status+")");const d=await r.json();USERS=(d.users||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const opt=USERS.filter(u=>u.marketingOptIn).length;$("usum").textContent=USERS.length?`${USERS.length} member${USERS.length===1?"":"s"} · ${opt} opted in to offers`:"No members yet.";
  $("utable").innerHTML=USERS.length?"<tr><th>Joined</th><th>Name</th><th>Email</th><th>Country / ZIP</th><th>Job families</th><th>Seniority</th><th>Search status</th><th>Offers</th></tr>"+USERS.slice(0,100).map(u=>`<tr><td>${esc((u.createdAt||"").slice(0,10))}</td><td>${esc((u.firstName||"")+" "+(u.lastName||""))}</td><td>${esc(u.email||"")}</td><td>${esc((u.country||"")+" "+(u.zip||""))}</td><td>${esc((u.jobFamilies||[]).join(", "))}</td><td>${esc((u.seniority||[]).join(", "))}</td><td>${esc(u.searchStatus||"")}</td><td>${u.marketingOptIn?"Yes":"No"}</td></tr>`).join(""):"";
 }catch(e){$("usum").textContent=String(e.message||e)}}
function exportUsers(fmt){if(!USERS.length){$("uMsg").textContent="No members to download.";return}const stamp=new Date().toISOString().slice(0,10);let blob,name;
 if(fmt==="json"){blob=new Blob([JSON.stringify(USERS)],{type:"application/json"});name=`jobfinder-members-${stamp}.json`}
 else{const cols=["createdAt","firstName","lastName","email","country","zip","jobFamilies","seniority","searchStatus","marketingOptIn","termsAcceptedAt","lastLoginAt","signupCountry","signupRegion","signupCity"];
  const get=(u,c)=>c==="signupCountry"?(u.signupGeo||{}).country:c==="signupRegion"?(u.signupGeo||{}).region:c==="signupCity"?(u.signupGeo||{}).city:u[c];
  const cell=v=>{if(Array.isArray(v))v=v.join(" | ");v=v==null?"":String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  blob=new Blob(["\ufeff"+[cols.join(",")].concat(USERS.map(u=>cols.map(c=>cell(get(u,c))).join(","))).join("\r\n")],{type:"text/csv"});name=`jobfinder-members-${stamp}.csv`}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);$("uMsg").textContent=`Downloaded ${USERS.length} profiles.`}
$("exUsers").onclick=()=>exportUsers("csv");$("exUsersJson").onclick=()=>exportUsers("json");

async function exportVisits(fmt){const bs=[$("exCsv"),$("exJson")];bs.forEach(b=>b.disabled=true);const m=$("exMsg");
 try{const H={"x-admin-key":KEY};const ix=await fetch("/api/export?index=1",{headers:H,cache:"no-store"});if(!ix.ok)throw new Error("Could not list days ("+ix.status+")");const days=(await ix.json()).days;if(!days.length){m.textContent="No visits stored yet.";return}
  const all=[];for(let i=0;i<days.length;i++){m.textContent=`Reading ${days[i]} (${i+1} of ${days.length})…`;const r=await fetch("/api/export?day="+days[i],{headers:H,cache:"no-store"});if(!r.ok)throw new Error(days[i]+" failed ("+r.status+")");all.push(...(await r.json()).visits)}
  all.sort((a,b)=>a.start-b.start);let blob,name;const stamp=new Date().toISOString().slice(0,10);
  if(fmt==="json"){blob=new Blob([JSON.stringify(all)],{type:"application/json"});name=`jobfinder-visits-${stamp}.json`}
  else{const cols=["start","last","sid","vid","active","views","returning","ref","utm","land","device","browser","os","lang","scr","tz","country","region","city","gtz","pg","f","q","clicks"];
   const cell=(k,v)=>{if(k==="start"||k==="last")v=v?new Date(v).toISOString():"";else if(Array.isArray(v))v=k==="clicks"?v.map(c=>(c.co||"")+": "+(c.t||"")).join(" | "):v.join(" | ");v=v==null?"":String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
   blob=new Blob(["\ufeff"+[cols.join(",")].concat(all.map(v=>cols.map(c=>cell(c,v[c])).join(","))).join("\r\n")],{type:"text/csv"});name=`jobfinder-visits-${stamp}.csv`}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);m.textContent=`Downloaded ${all.length} visits from ${days.length} days.`;
 }catch(e){m.textContent=String(e.message||e)}finally{bs.forEach(b=>b.disabled=false)}}
async function fetchAll(m){const H={"x-admin-key":KEY};const ix=await fetch("/api/export?index=1",{headers:H,cache:"no-store"});if(!ix.ok)throw new Error("Could not list days ("+ix.status+")");const days=(await ix.json()).days,all=[];
 for(let i=0;i<days.length;i++){m.textContent=`Reading ${days[i]} (${i+1} of ${days.length})…`;const r=await fetch("/api/export?day="+days[i],{headers:H,cache:"no-store"});if(!r.ok)throw new Error(days[i]+" failed ("+r.status+")");all.push(...(await r.json()).visits)}
 all.sort((a,b)=>a.start-b.start);return all}
const FLN={freg:"Region",fdomain:"Domain",frole:"Role",fc:"Company",fs:"State",fcn:"Country",chip:"Quick pick",fl:"Seniority",fr:"Remote",ffit:"Senior only",fd:"Department"};
async function exportEvents(kind,btn){const m=$("exMsg");const old=btn.textContent;btn.disabled=true;btn.textContent="Preparing…";
 try{const all=await fetchAll(btn);const rows=[];
  for(const v of all){const base=[v.start?new Date(v.start).toISOString():"",v.sid||"",v.vid||"",v.country||"",v.region||"",v.city||"",v.device||""];
   if(kind==="search")(v.q||[]).forEach(q=>rows.push(base.concat([q])));
   else if(kind==="filter")(v.f||[]).forEach(f=>{const i=f.indexOf(":");const id=f.slice(0,i);rows.push(base.concat([FLN[id]||id,f.slice(i+1)]))});
   else (v.clicks||[]).forEach(c=>rows.push(base.concat([c.co||"",c.t||""])))}
  const head=["visit_start","session","visitor","country","region","city","device"].concat(kind==="search"?["search_term"]:kind==="filter"?["filter","value"]:["company","job_title"]);
  const cell=v=>{v=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const blob=new Blob(["\ufeff"+[head.join(",")].concat(rows.map(r=>r.map(cell).join(","))).join("\r\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`jobfinder-${kind==="click"?"job-clicks":kind==="search"?"searches":"filters"}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  btn.textContent=`Downloaded ${rows.length}`;setTimeout(()=>{btn.textContent=old},3000)}
 catch(e){btn.textContent=old;m.textContent=String(e.message||e)}finally{btn.disabled=false}}
$("exCsv").onclick=()=>exportVisits("csv");$("exJson").onclick=()=>exportVisits("json");
</script></body></html>
